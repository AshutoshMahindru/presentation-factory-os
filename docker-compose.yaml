version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: pfos-postgres
    environment:
      POSTGRES_DB: pfos
      POSTGRES_USER: pfos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfos_dev_password}
    ports:
    - 5432:5432
    volumes:
    - pfos_postgres_data:/var/lib/postgresql/data
    - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pfos -d pfos
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - pfos_data
  neo4j:
    image: neo4j:5
    container_name: pfos-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-pfos_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
    ports:
    - 7474:7474
    - 7687:7687
    volumes:
    - pfos_neo4j_data:/data
    - pfos_neo4j_logs:/logs
    - ./infra/neo4j:/var/lib/neo4j/import:ro
    healthcheck:
      test:
      - CMD-SHELL
      - cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-pfos_neo4j_password} 'RETURN 1'
        || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
    - pfos_data
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pfos-qdrant
    ports:
    - 6333:6333
    volumes:
    - pfos_qdrant_data:/qdrant/storage
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:6333/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - pfos_data
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: pfos-litellm
    command:
    - --config
    - /app/config.yaml
    - --port
    - '4000'
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: postgresql://pfos:${POSTGRES_PASSWORD:-pfos_dev_password}@postgres:5432/pfos
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOCAL_VLLM_API_KEY: ${LOCAL_VLLM_API_KEY:-local-dev-key}
    ports:
    - 4000:4000
    volumes:
    - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - pfos_data
    - pfos_service
    - pfos_agent_runtime
  workflow-service:
    build:
      context: .
      dockerfile: docker/workflow-service.Dockerfile
    container_name: pfos-workflow-service
    environment:
      POSTGRES_URL: postgresql://pfos:${POSTGRES_PASSWORD:-pfos_dev_password}@postgres:5432/pfos
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pfos_neo4j_password}
      LITELLM_URL: http://litellm-proxy:4000
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      litellm-proxy:
        condition: service_started
    networks:
    - pfos_data
    - pfos_service
    - pfos_agent_runtime
  agent-service:
    build:
      context: .
      dockerfile: docker/agent-service.Dockerfile
    container_name: pfos-agent-service
    environment:
      RETRIEVAL_URL: http://retrieval-engine:8002
      TOOL_SERVER_URL: http://tool-server:8003
      LITELLM_URL: http://litellm-proxy:4000
      WORKFLOW_URL: http://workflow-service:8000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    depends_on:
      retrieval-engine:
        condition: service_started
      tool-server:
        condition: service_started
      litellm-proxy:
        condition: service_started
      workflow-service:
        condition: service_started
    networks:
    - pfos_agent_runtime
  tool-server:
    build:
      context: .
      dockerfile: docker/tool-server.Dockerfile
    container_name: pfos-tool-server
    environment:
      POSTGRES_URL: postgresql://pfos:${POSTGRES_PASSWORD:-pfos_dev_password}@postgres:5432/pfos
    ports:
    - 8003:8003
    volumes:
    - pfos_tool_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - pfos_data
    - pfos_service
    - pfos_agent_runtime
  retrieval-engine:
    build:
      context: .
      dockerfile: docker/retrieval-engine.Dockerfile
    container_name: pfos-retrieval-engine
    environment:
      POSTGRES_URL: postgresql://pfos:${POSTGRES_PASSWORD:-pfos_dev_password}@postgres:5432/pfos
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pfos_neo4j_password}
      QDRANT_URL: http://qdrant:6333
      LITELLM_URL: http://litellm-proxy:4000
    ports:
    - 8002:8002
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm-proxy:
        condition: service_started
    networks:
    - pfos_data
    - pfos_service
    - pfos_agent_runtime
  job-runner:
    build:
      context: .
      dockerfile: docker/job-runner.Dockerfile
    container_name: pfos-job-runner
    environment:
      POSTGRES_URL: postgresql://pfos:${POSTGRES_PASSWORD:-pfos_dev_password}@postgres:5432/pfos
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pfos_neo4j_password}
      WORKFLOW_URL: http://workflow-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      workflow-service:
        condition: service_started
    networks:
    - pfos_data
    - pfos_service
  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: pfos-ui
    environment:
      NEXT_PUBLIC_WORKFLOW_URL: http://localhost:8000
    ports:
    - 3000:3000
    depends_on:
      workflow-service:
        condition: service_started
    networks:
    - pfos_service
volumes:
  pfos_postgres_data: null
  pfos_neo4j_data: null
  pfos_neo4j_logs: null
  pfos_qdrant_data: null
  pfos_tool_outputs: null
networks:
  pfos_data:
    driver: bridge
    internal: true
  pfos_service:
    driver: bridge
  pfos_agent_runtime:
    driver: bridge
    internal: true
