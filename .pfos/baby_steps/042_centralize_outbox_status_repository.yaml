step_id: 42
name: centralize_outbox_status_repository
branch: baby-step-42-centralize-outbox-status-repository
objective: >
  Add a deterministic Postgres-backed outbox status repository that reports
  whether a project is blocked by failed or unprocessed outbox rows, including
  unprocessed count, failed count, and oldest unprocessed age.

commit_message: Add centralized outbox status repository

commands:
  - name: create outbox repository and tests
    run: |
      cat > system/outbox_repository.py <<'PY'
      from __future__ import annotations

      import subprocess
      from dataclasses import dataclass


      COMPOSE_FILE = "docker-compose.apps.yaml"


      @dataclass(frozen=True)
      class OutboxStatus:
          project_id: str
          blocked: bool
          unprocessed_count: int
          failed_count: int
          oldest_unprocessed_age_seconds: int | None


      class OutboxRepository:
          """
          Deterministic Postgres-backed outbox status reader.

          A project is blocked when it has any unprocessed outbox rows or any
          unprocessed rows with error_count > 0. This repository centralizes the
          outbox blocking query so workflow transitions, health endpoints, and
          export gates do not drift.
          """

          def get_project_outbox_status(self, project_id: str) -> OutboxStatus:
              sql = f"""
              SELECT
                count(*) FILTER (WHERE processed = FALSE) AS unprocessed_count,
                count(*) FILTER (WHERE processed = FALSE AND error_count > 0) AS failed_count,
                floor(
                  extract(
                    epoch FROM (
                      now() - min(created_at) FILTER (WHERE processed = FALSE)
                    )
                  )
                )::int AS oldest_unprocessed_age_seconds
              FROM outbox
              WHERE project_id = '{self._sql(project_id)}';
              """

              result = self._psql(sql)
              if result.returncode != 0:
                  raise RuntimeError(result.stderr)

              line = result.stdout.strip()
              if not line:
                  return OutboxStatus(
                      project_id=project_id,
                      blocked=False,
                      unprocessed_count=0,
                      failed_count=0,
                      oldest_unprocessed_age_seconds=None,
                  )

              parts = [part.strip() for part in line.split("|")]
              if len(parts) != 3:
                  raise RuntimeError(f"Unexpected outbox status result: {result.stdout!r}")

              unprocessed_count = self._parse_int(parts[0])
              failed_count = self._parse_int(parts[1])
              oldest_age = self._parse_optional_int(parts[2])

              return OutboxStatus(
                  project_id=project_id,
                  blocked=unprocessed_count > 0 or failed_count > 0,
                  unprocessed_count=unprocessed_count,
                  failed_count=failed_count,
                  oldest_unprocessed_age_seconds=oldest_age,
              )

          def project_has_blocking_outbox_rows(self, project_id: str) -> tuple[bool, int]:
              status = self.get_project_outbox_status(project_id)
              return status.blocked, status.unprocessed_count + status.failed_count

          def _psql(self, sql: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [
                      "docker",
                      "compose",
                      "-f",
                      COMPOSE_FILE,
                      "exec",
                      "-T",
                      "postgres",
                      "psql",
                      "-U",
                      "pfos",
                      "-d",
                      "pfos",
                      "-v",
                      "ON_ERROR_STOP=1",
                      "-A",
                      "-t",
                      "-F",
                      "|",
                      "-c",
                      sql,
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )

          def _parse_int(self, value: str) -> int:
              if value == "":
                  return 0
              return int(value)

          def _parse_optional_int(self, value: str) -> int | None:
              if value == "":
                  return None
              return int(value)

          def _sql(self, value: str) -> str:
              return str(value).replace("'", "''")
      PY

      cat > tests/unit/test_outbox_repository.py <<'PY'
      from __future__ import annotations

      from system.outbox_repository import OutboxRepository, OutboxStatus


      class FakeResult:
          def __init__(self, stdout: str, returncode: int = 0, stderr: str = "") -> None:
              self.stdout = stdout
              self.returncode = returncode
              self.stderr = stderr


      def test_outbox_repository_reports_clean_project() -> None:
          repository = OutboxRepository()

          def fake_psql(sql: str) -> FakeResult:
              return FakeResult("0|0|\n")

          repository._psql = fake_psql  # type: ignore[method-assign]

          status = repository.get_project_outbox_status("project-1")

          assert status == OutboxStatus(
              project_id="project-1",
              blocked=False,
              unprocessed_count=0,
              failed_count=0,
              oldest_unprocessed_age_seconds=None,
          )


      def test_outbox_repository_reports_unprocessed_rows_as_blocking() -> None:
          repository = OutboxRepository()

          def fake_psql(sql: str) -> FakeResult:
              return FakeResult("2|0|31\n")

          repository._psql = fake_psql  # type: ignore[method-assign]

          status = repository.get_project_outbox_status("project-2")

          assert status.blocked is True
          assert status.unprocessed_count == 2
          assert status.failed_count == 0
          assert status.oldest_unprocessed_age_seconds == 31


      def test_outbox_repository_reports_failed_rows_as_blocking() -> None:
          repository = OutboxRepository()

          def fake_psql(sql: str) -> FakeResult:
              return FakeResult("2|1|45\n")

          repository._psql = fake_psql  # type: ignore[method-assign]

          status = repository.get_project_outbox_status("project-3")

          assert status.blocked is True
          assert status.unprocessed_count == 2
          assert status.failed_count == 1
          assert status.oldest_unprocessed_age_seconds == 45


      def test_project_has_blocking_outbox_rows_returns_legacy_tuple() -> None:
          repository = OutboxRepository()

          def fake_status(project_id: str) -> OutboxStatus:
              return OutboxStatus(
                  project_id=project_id,
                  blocked=True,
                  unprocessed_count=3,
                  failed_count=1,
                  oldest_unprocessed_age_seconds=12,
              )

          repository.get_project_outbox_status = fake_status  # type: ignore[method-assign]

          blocked, count = repository.project_has_blocking_outbox_rows("project-4")

          assert blocked is True
          assert count == 4


      def test_outbox_repository_sql_is_project_scoped_and_uses_outbox_table() -> None:
          repository = OutboxRepository()
          captured: dict[str, str] = {}

          def fake_psql(sql: str) -> FakeResult:
              captured["sql"] = sql
              return FakeResult("0|0|\n")

          repository._psql = fake_psql  # type: ignore[method-assign]
          repository.get_project_outbox_status("project-with-'quote")

          assert "FROM outbox" in captured["sql"]
          assert "project_id = 'project-with-''quote'" in captured["sql"]
          assert "processed = FALSE" in captured["sql"]
          assert "error_count > 0" in captured["sql"]
      PY

validation_commands:
  - python -m compileall system
  - pytest tests/unit/test_outbox_repository.py -vv
  - make validate

files_expected:
  - system/outbox_repository.py
  - tests/unit/test_outbox_repository.py
  - .pfos/baby_steps/042_centralize_outbox_status_repository.yaml
