objective: >
  Lay the foundation for sandbox financial model work. Add two new
  tables — financial_model_specs and financial_scenarios — to the canonical
  Postgres schema. Specs live in a sandbox (draft → compiled → validated →
  promoted) and are linked to thesis_pillars so a pillar can have at most
  one active sandbox spec at a time. Scenarios are named override sets
  feeding a spec. Provide a FinancialSpecRepository covering create / get
  / list / status transitions / mark-promoted / scenario CRUD. Schema is
  applied identically to docs/04_Database_Schemas.sql and
  infra/postgres/init/001_schema.sql to keep the canonical drift check green.
