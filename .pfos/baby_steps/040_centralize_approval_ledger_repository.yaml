step_id: 40
name: centralize_approval_ledger_repository
branch: baby-step-40-centralize-approval-ledger-repository
objective: >
  Centralize Postgres-backed approval ledger reads so the approval status endpoint
  and approval_quorum_met guard use the same snapshot-window semantics.

commit_message: Centralize approval ledger repository

commands:
  - name: create centralized repository and patch callers
    run: |
      cat > system/approval_ledger_repository.py <<'PY'
      from __future__ import annotations

      import json
      import subprocess
      from typing import Any

      from system.approval_quorum import ApprovalEntry


      COMPOSE_FILE = "docker-compose.apps.yaml"


      class ApprovalLedgerRepository:
          """
          Postgres-backed approval ledger repository.

          This repository is intentionally deterministic and snapshot-window aware.
          Approval rows count toward quorum only if they were created after the
          latest successful entry into the evaluated phase.
          """

          def record_approval(
              self,
              project_id: str,
              phase: str,
              actor_email: str,
              role: str,
              decision: str,
              rubric_score_snapshot: dict[str, Any],
              notes: str | None = None,
          ) -> None:
              snapshot_json = self._json(rubric_score_snapshot)

              sql = f"""
              INSERT INTO approval_ledger (
                project_id,
                phase,
                actor_email,
                role,
                decision,
                rubric_score_snapshot,
                notes
              )
              VALUES (
                '{self._sql(project_id)}',
                '{self._sql(phase)}',
                '{self._sql(actor_email)}',
                '{self._sql(role)}',
                '{self._sql(decision)}',
                '{snapshot_json}'::jsonb,
                {self._nullable(notes)}
              );
              """

              result = self._psql(sql)
              if result.returncode != 0:
                  raise RuntimeError(result.stderr)

          def list_approval_dicts_for_phase(self, project_id: str, phase: str) -> list[dict[str, Any]]:
              return [
                  {
                      "actor_email": entry.actor_email,
                      "role": entry.role,
                      "decision": entry.decision,
                  }
                  for entry in self.list_approvals_for_phase(project_id, phase)
              ]

          def list_approvals_for_phase(self, project_id: str, phase: str) -> list[ApprovalEntry]:
              sql = f"""
              WITH latest_phase_entry AS (
                SELECT max(created_at) AS entered_at
                FROM phase_transitions
                WHERE project_id = '{self._sql(project_id)}'
                  AND to_phase = '{self._sql(phase)}'
                  AND transition_kind IN ('forward', 'initial')
              )
              SELECT
                approval_ledger.actor_email,
                approval_ledger.role,
                approval_ledger.decision
              FROM approval_ledger
              CROSS JOIN latest_phase_entry
              WHERE approval_ledger.project_id = '{self._sql(project_id)}'
                AND approval_ledger.phase = '{self._sql(phase)}'
                AND (
                  latest_phase_entry.entered_at IS NULL
                  OR approval_ledger.created_at > latest_phase_entry.entered_at
                )
              ORDER BY approval_ledger.created_at ASC;
              """

              result = self._psql(sql)
              if result.returncode != 0:
                  raise RuntimeError(result.stderr)

              entries: list[ApprovalEntry] = []
              for line in result.stdout.splitlines():
                  if "|" not in line:
                      continue

                  actor_email, role, decision = [part.strip() for part in line.split("|")]
                  entries.append(
                      ApprovalEntry(
                          actor_email=actor_email,
                          role=role,
                          decision=decision,
                      )
                  )

              return entries

          def _psql(self, sql: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [
                      "docker",
                      "compose",
                      "-f",
                      COMPOSE_FILE,
                      "exec",
                      "-T",
                      "postgres",
                      "psql",
                      "-U",
                      "pfos",
                      "-d",
                      "pfos",
                      "-v",
                      "ON_ERROR_STOP=1",
                      "-A",
                      "-t",
                      "-F",
                      "|",
                      "-c",
                      sql,
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )

          def _json(self, value: dict[str, Any]) -> str:
              return self._sql(json.dumps(value))

          def _nullable(self, value: str | None) -> str:
              if value is None:
                  return "NULL"
              return f"'{self._sql(value)}'"

          def _sql(self, value: str) -> str:
              return str(value).replace("'", "''")
      PY

      python - <<'PY'
      from pathlib import Path

      path = Path("system/guards.py")
      text = path.read_text()

      # Add centralized import.
      if "from system.approval_ledger_repository import ApprovalLedgerRepository" not in text:
          text = text.replace(
              "from system.approval_quorum import ApprovalEntry, ApprovalQuorum\n",
              "from system.approval_quorum import ApprovalQuorum\nfrom system.approval_ledger_repository import ApprovalLedgerRepository\n",
          )

      # Remove local subprocess import if unused after class removal.
      text = text.replace("import subprocess\n", "")

      # Remove local ApprovalLedgerRepository class.
      start_marker = "class ApprovalLedgerRepository:\n"
      end_marker = "\n\nclass GuardEvaluator:"
      if start_marker in text:
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end + 2:]

      path.write_text(text)
      PY

      python - <<'PY'
      from pathlib import Path

      path = Path("api/project_repository.py")
      text = path.read_text()

      if "from system.approval_ledger_repository import ApprovalLedgerRepository" not in text:
          anchor = "from typing import Any\n"
          text = text.replace(anchor, anchor + "\nfrom system.approval_ledger_repository import ApprovalLedgerRepository\n")

      if "approval_ledger_repository = ApprovalLedgerRepository()" not in text:
          text = text.replace(
              "class ProjectRepository:\n",
              "approval_ledger_repository = ApprovalLedgerRepository()\n\n\nclass ProjectRepository:\n",
          )

      # Replace record_approval body with centralized delegate.
      start = text.index("    def record_approval(")
      end = text.index("\n\n    def list_approvals_for_phase", start)
      replacement = '''    def record_approval(
          self,
          project_id: str,
          phase: str,
          actor_email: str,
          role: str,
          decision: str,
          rubric_score_snapshot: dict[str, Any],
          notes: str | None = None,
      ) -> None:
          approval_ledger_repository.record_approval(
              project_id=project_id,
              phase=phase,
              actor_email=actor_email,
              role=role,
              decision=decision,
              rubric_score_snapshot=rubric_score_snapshot,
              notes=notes,
          )
      '''
      text = text[:start] + replacement + text[end:]

      # Replace list_approvals_for_phase with centralized delegate.
      start = text.index("    def list_approvals_for_phase(")
      end = text.index("\n\n    def record_phase_transition", start)
      replacement = '''    def list_approvals_for_phase(self, project_id: str, phase: str) -> list[dict[str, Any]]:
          return approval_ledger_repository.list_approval_dicts_for_phase(project_id, phase)
      '''
      text = text[:start] + replacement + text[end:]

      path.write_text(text)
      PY

      cat > tests/unit/test_approval_ledger_repository.py <<'PY'
      from __future__ import annotations

      from system.approval_ledger_repository import ApprovalLedgerRepository


      def test_approval_ledger_repository_exposes_snapshot_window_query() -> None:
          repository = ApprovalLedgerRepository()
          sql_project_id = "00000000-0000-0000-0000-000000000001"
          sql_phase = "review"

          # Build indirectly by monkeypatching _psql so this stays unit-level.
          captured: dict[str, str] = {}

          class FakeResult:
              returncode = 0
              stdout = ""
              stderr = ""

          def fake_psql(sql: str) -> FakeResult:
              captured["sql"] = sql
              return FakeResult()

          repository._psql = fake_psql  # type: ignore[method-assign]
          repository.list_approvals_for_phase(sql_project_id, sql_phase)

          assert "latest_phase_entry" in captured["sql"]
          assert "phase_transitions" in captured["sql"]
          assert "approval_ledger.created_at > latest_phase_entry.entered_at" in captured["sql"]
      PY

validation_commands:
  - python -m compileall api system
  - pytest tests/unit/test_approval_ledger_repository.py -vv
  - pytest tests/unit/test_approval_quorum_guard_postgres_backed.py -vv
  - pytest tests/integration/test_approval_status_endpoint.py -vv
  - pytest tests/integration/test_approval_quorum_transition_postgres.py -vv
  - pytest tests/integration/test_approval_quorum_snapshot_window.py -vv
  - make validate

files_expected:
  - system/approval_ledger_repository.py
  - system/guards.py
  - api/project_repository.py
  - tests/unit/test_approval_ledger_repository.py
  - .pfos/baby_steps/040_centralize_approval_ledger_repository.yaml
