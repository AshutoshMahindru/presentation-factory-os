step_id: 38
name: approval_status_endpoint
branch: baby-step-38-approval-status-endpoint
objective: >
  Add a Postgres-backed approval quorum status endpoint so clients and UI can
  inspect approval ledger state for a project phase without attempting a phase transition.

commit_message: Add approval status endpoint

commands:
  - name: patch workflow approval status endpoint and tests
    run: |
      python - <<'PY'
      from pathlib import Path

      workflow_path = Path("api/workflow.py")
      text = workflow_path.read_text()

      if "class ApprovalStatusResponse(BaseModel):" not in text:
          marker = '''class ApprovalSubmissionRequest(BaseModel):
          phase: str
          actor_email: str = Field(min_length=1)
          role: str = Field(min_length=1)
          decision: str = Field(min_length=1)
          rubric_score_snapshot: dict[str, Any] = Field(default_factory=dict)
          notes: str | None = None
      '''

          replacement = marker + '''


      class ApprovalStatusResponse(BaseModel):
          project_id: str
          phase: str
          quorum_met: bool
          decision_rule: str
          required_count: int
          approved_count: int
          rejected_count: int
          abstained_count: int
          changes_requested_count: int
          missing_roles: dict[str, int]
          blocking_rejection: bool
      '''

          if marker not in text:
              raise SystemExit("Could not find ApprovalSubmissionRequest block in api/workflow.py")

          text = text.replace(marker, replacement)

      if "@app.get(\"/projects/{project_id}/approvals/status/{phase}\"" not in text:
          insert_before = '''@app.post("/projects/{project_id}/phase-transitions")
      def request_phase_transition(project_id: str, payload: PhaseTransitionRequest) -> dict[str, Any]:
      '''

          endpoint = '''@app.get("/projects/{project_id}/approvals/status/{phase}", response_model=ApprovalStatusResponse)
      def get_approval_status(project_id: str, phase: str) -> ApprovalStatusResponse:
          project = project_repository.get_project(project_id)
          if project is None:
              raise HTTPException(status_code=404, detail={"error": "project_not_found"})

          approvals = project_repository.list_approvals_for_phase(project_id, phase)
          entries = [
              ApprovalEntry(
                  actor_email=approval["actor_email"],
                  role=approval["role"],
                  decision=approval["decision"],
              )
              for approval in approvals
          ]

          try:
              quorum_result = ApprovalQuorum.from_yaml().evaluate(phase, entries)
          except Exception as exc:
              raise HTTPException(
                  status_code=422,
                  detail={
                      "error": "approval_status_unavailable",
                      "project_id": project_id,
                      "phase": phase,
                      "message": str(exc),
                  },
              ) from exc

          return ApprovalStatusResponse(
              project_id=project_id,
              phase=phase,
              quorum_met=quorum_result.quorum_met,
              decision_rule=quorum_result.decision_rule,
              required_count=quorum_result.required_count,
              approved_count=quorum_result.approved_count,
              rejected_count=quorum_result.rejected_count,
              abstained_count=quorum_result.abstained_count,
              changes_requested_count=quorum_result.changes_requested_count,
              missing_roles=quorum_result.missing_roles,
              blocking_rejection=quorum_result.blocking_rejection,
          )


      '''

          if insert_before not in text:
              raise SystemExit("Could not find phase transition endpoint insertion point in api/workflow.py")

          text = text.replace(insert_before, endpoint + insert_before)

      workflow_path.write_text(text)
      PY

      cat > tests/integration/test_approval_status_endpoint.py <<'PY'
      from __future__ import annotations

      from fastapi.testclient import TestClient

      from api.workflow import app, project_repository


      client = TestClient(app)


      VALID_AUDIENCE_PROFILE = {
          "decision_maker_type": "ic_partner",
          "risk_tolerance": "medium",
          "familiarity_with_topic": "informed",
          "known_objections": ["market_size", "team_risk"],
          "stakeholder_map": [
              {
                  "role": "economic_buyer",
                  "concern": "return on invested capital",
              }
          ],
      }


      def test_approval_status_endpoint_reports_missing_review_quorum() -> None:
          project = project_repository.create_project(
              name="Step 38 Approval Status Missing Quorum",
              audience="Investment committee",
              audience_profile=VALID_AUDIENCE_PROFILE,
          )

          response = client.get(f"/projects/{project.project_id}/approvals/status/review")

          assert response.status_code == 200
          body = response.json()

          assert body["project_id"] == project.project_id
          assert body["phase"] == "review"
          assert body["quorum_met"] is False
          assert body["decision_rule"] == "unanimous"
          assert body["required_count"] == 2
          assert body["approved_count"] == 0
          assert body["rejected_count"] == 0
          assert body["changes_requested_count"] == 0
          assert body["abstained_count"] == 0
          assert body["missing_roles"] == {"ic_member": 1}
          assert body["blocking_rejection"] is False


      def test_approval_status_endpoint_reports_met_review_quorum() -> None:
          project = project_repository.create_project(
              name="Step 38 Approval Status Met Quorum",
              audience="Investment committee",
              audience_profile=VALID_AUDIENCE_PROFILE,
          )

          project_repository.record_approval(
              project_id=project.project_id,
              phase="review",
              actor_email="partner@example.com",
              role="partner",
              decision="approved",
              rubric_score_snapshot={"overall": 4.3},
              notes="Partner approval.",
          )

          project_repository.record_approval(
              project_id=project.project_id,
              phase="review",
              actor_email="ic@example.com",
              role="ic_member",
              decision="approved",
              rubric_score_snapshot={"overall": 4.4},
              notes="IC approval.",
          )

          response = client.get(f"/projects/{project.project_id}/approvals/status/review")

          assert response.status_code == 200
          body = response.json()

          assert body["project_id"] == project.project_id
          assert body["phase"] == "review"
          assert body["quorum_met"] is True
          assert body["decision_rule"] == "unanimous"
          assert body["required_count"] == 2
          assert body["approved_count"] == 2
          assert body["rejected_count"] == 0
          assert body["changes_requested_count"] == 0
          assert body["abstained_count"] == 0
          assert body["missing_roles"] == {}
          assert body["blocking_rejection"] is False


      def test_approval_status_endpoint_reports_blocking_rejection() -> None:
          project = project_repository.create_project(
              name="Step 38 Approval Status Rejection",
              audience="Investment committee",
              audience_profile=VALID_AUDIENCE_PROFILE,
          )

          project_repository.record_approval(
              project_id=project.project_id,
              phase="review",
              actor_email="partner@example.com",
              role="partner",
              decision="approved",
              rubric_score_snapshot={"overall": 4.1},
              notes="Partner approval.",
          )

          project_repository.record_approval(
              project_id=project.project_id,
              phase="review",
              actor_email="ic@example.com",
              role="ic_member",
              decision="rejected",
              rubric_score_snapshot={"overall": 2.0},
              notes="IC rejection.",
          )

          response = client.get(f"/projects/{project.project_id}/approvals/status/review")

          assert response.status_code == 200
          body = response.json()

          assert body["quorum_met"] is False
          assert body["approved_count"] == 1
          assert body["rejected_count"] == 1
          assert body["blocking_rejection"] is True


      def test_approval_status_endpoint_404_for_unknown_project() -> None:
          response = client.get(
              "/projects/00000000-0000-0000-0000-000000000000/approvals/status/review"
          )

          assert response.status_code == 404
          assert response.json()["detail"]["error"] == "project_not_found"


      def test_approval_status_endpoint_422_for_unknown_phase() -> None:
          project = project_repository.create_project(
              name="Step 38 Approval Status Unknown Phase",
              audience="Investment committee",
              audience_profile=VALID_AUDIENCE_PROFILE,
          )

          response = client.get(f"/projects/{project.project_id}/approvals/status/visual_design")

          assert response.status_code == 422
          body = response.json()["detail"]

          assert body["error"] == "approval_status_unavailable"
          assert body["project_id"] == project.project_id
          assert body["phase"] == "visual_design"
      PY

validation_commands:
  - python -m compileall api system
  - pytest tests/integration/test_approval_status_endpoint.py -vv
  - pytest tests/integration/test_approval_quorum_transition_postgres.py -vv
  - make validate

files_expected:
  - api/workflow.py
  - tests/integration/test_approval_status_endpoint.py
  - .pfos/baby_steps/038_approval_status_endpoint.yaml
