name: PFOS validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: Run optional load tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  COMPOSE_PROJECT_NAME: pfos-ci
  COMPOSE_FILE: docker-compose.apps.yaml

jobs:
  validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate YAML
        run: python scripts/validate_yaml.py

      - name: Validate JSON schemas
        run: make validate-json

      - name: Compile Python packages
        run: make compile

      - name: Enforce agent datastore boundary
        run: make no-agent-db-imports

  integration:
    name: Service-backed validation
    runs-on: ubuntu-latest
    needs: validation
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start PFOS services
        run: make docker-up

      - name: Validate live Postgres schema
        run: make validate-sql-live

      - name: Wait for Neo4j
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" exec -T neo4j cypher-shell -u neo4j -p pfos_neo4j_password "RETURN 1"; then
              exit 0
            fi
            echo "Neo4j is not ready yet; attempt ${attempt}/60."
            sleep 2
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" logs neo4j
          exit 1

      - name: Validate live Neo4j constraints
        run: make validate-cypher-live

      - name: Check Docker environment
        run: make docker-doctor

      - name: Run full validation suite
        run: make validate

      - name: Run API and control-plane integration tests
        run: |
          pytest -vv \
            tests/integration/test_workflow_api_postgres.py \
            tests/integration/test_approval_ledger_api.py \
            tests/integration/test_approval_status_endpoint.py \
            tests/integration/test_hard_gate_status_endpoint.py \
            tests/integration/test_source_lifecycle_event_api.py \
            tests/integration/test_source_lifecycle_event_status_api.py \
            tests/integration/test_source_retraction_status_endpoint.py

      - name: Run source lifecycle and outbox integration tests
        run: |
          pytest -vv \
            tests/integration/test_outbox_eventual_consistency.py \
            tests/integration/test_outbox_neo4j_failure_retry_backoff.py \
            tests/integration/test_outbox_neo4j_side_effect.py \
            tests/integration/test_workflow_outbox_gate.py \
            tests/integration/test_workflow_outbox_repository_blocking.py \
            tests/integration/test_source_retraction_e2e_regression.py \
            tests/integration/test_source_lifecycle_outbox_live_smoke.py

      - name: Run deck and export validation tests
        run: |
          pytest -vv \
            tests/unit/test_export_gate.py \
            tests/unit/test_slide_schema.py \
            tests/unit/test_narrative_arc_validator.py

      - name: Stop PFOS services
        if: always()
        run: make docker-down

  load-test:
    name: Optional load tests
    runs-on: ubuntu-latest
    needs: validation
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_load_tests }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start PFOS services
        run: make docker-up

      - name: Validate live Postgres schema
        run: make validate-sql-live

      - name: Run load tests when implemented
        run: |
          if grep -R "^def test_" tests/load >/dev/null; then
            pytest -vv tests/load
          else
            echo "No executable load tests are checked in yet; skipping optional load-test job."
          fi

      - name: Stop PFOS services
        if: always()
        run: make docker-down
